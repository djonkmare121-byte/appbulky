  text-transform:uppercase;
}

.font-brand{
  font-family:'Unbounded', 'Orbitron', 'Space Grotesk', sans-serif;
  font-weight:800;
  letter-spacing:0.5px;
  color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}

.measure-full{
  position:fixed;
  inset:0;
  width:100vw;
  max-width:100vw;
  height:100dvh;
  height:100svh;
  overflow:hidden;
}

.measure-video{
  position:absolute;
  inset:0;
  width:100vw;
  max-width:100vw;
  height:100dvh;
  height:100svh;
  -o-object-fit:cover;
     object-fit:cover;
  -o-object-position:center;
     object-position:center;
}

.ukur{
  position:fixed;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:100dvh;
  height:100svh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#000;
  color:#fff;
  box-shadow:0 0 48px rgba(0,0,0,.5);
  z-index:50;
}

@media (max-width:480px){
  .ukur{
    left:0;
    transform:none;
    max-width:100vw;
    width:100vw;
    height:100dvh;
    height:100svh;
    box-shadow:none;
  }
}

.ukur-top{
  background:#FF6B00;
  padding-top:calc(var(--safe-area-inset-top) + 10px);
  padding-left:16px;
  padding-right:16px;
  padding-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-shrink:0;
}

.cam{
  position:relative;
  flex:1;
  min-height:0;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cam video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover;
  -o-object-position:center;
     object-position:center;
}

.cam .cam-placeholder{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  background:#000;
}

.cam .cam-guide{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:78%;
  height:62%;
  max-width:340px;
  max-height:300px;
  border:2px dashed #FF6B00;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

.panel{
  background:#161616;
  padding:14px;

  overflow-y:auto;
  max-height:56dvh;
  flex-shrink:0;
  border-top:2px solid #FF6B00;
}

input,select,textarea{
  font-family:inherit;
  color:var(--ink);
}

input::-moz-placeholder, textarea::-moz-placeholder{
  color:var(--muted);
  opacity:1;
}

input::placeholder,textarea::placeholder{
  color:var(--muted);
  opacity:1;
}

select option{
  background:var(--surface);
  color:var(--ink);
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

.box3d{
  transform-style:preserve-3d;
  transition:width .2s ease-out, height .2s ease-out;
}

.card{
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
  transition:background-color .25s ease-out, border-color .25s ease-out, color .25s ease-out;
}

.field{
  width:100%;
  min-height:48px;
  background:var(--input);
  border:1px solid var(--input-line);
  border-radius:12px;
  padding:0 14px;
  font-size:15px;
  font-weight:600;
  color:var(--ink);
  outline:none;
  transition:background-color .25s ease-out, border-color .25s ease-out;
}

.field:focus{
  border-color:#FF6B00;
  box-shadow:0 0 0 3px rgba(255,107,0,.22);
}

.field-sm{
  min-height:48px;
}

.label-caps{
  font-size:11px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}

.btn-primary{
  background:#FF6B00;
  color:#fff;
  font-weight:700;
  border-radius:12px;
}

.btn-primary:active{
  transform:translateY(1px);
}

.btn-dark{
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line);
}

.btn-outline{
  background:var(--surface-2);
  color:var(--ink);
  border:1px solid var(--line);
  font-weight:700;
  border-radius:12px;
  transition:background-color .25s ease-out, border-color .25s ease-out;
}

  -webkit-appearance:none;
  -moz-appearance:none;
       appearance:none;
  width:100%;
  height:48px;
  background:transparent;
  outline:none;

}

input[type=range]::-webkit-slider-runnable-track{
  height:6px;

  box-shadow:0 2px 10px rgba(0,0,0,.35);
  cursor:pointer;
}

.divider{
  height:1px;

}

@keyframes toast-in{
  from{
    opacity:0;
    transform:translate(-50%,-8px);
  }

  to{
    opacity:1;
    transform:translate(-50%,0);
  }

.toast-anim{
  animation:toast-in .2s ease-out both;
}

.pop-anim{
